<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cleaner job checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B5E3B;text-decoration:none}a:hover{color:#0F3B26}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F7F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15211B; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #FFFFFF; border-bottom: 1px solid #E2E7E3; padding: 14px 12px 14px 8px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 6px">
<a href="CleanerToday.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15211B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 18px; font-weight: 800">Oakfield Lettings</h1><span style="font-size: 13px; color: #55615A">Flat 2, 9 Mill Lane · 12:30–14:30</span></div>
<span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #FFF1D1; color: #7A4B00">In progress</span>
</div>
<div style="padding: 0 6px 0 12px"><div style="height: 8px; border-radius: 99px; background: #E8ECE9; overflow: hidden"><div style="{{bar}}"></div></div><div style="font-size: 13px; color: #34403A; margin-top: 6px; font-weight: 600">{{doneLabel}}</div></div>
</header>

<div style="margin: 12px 16px 0; background: #FFF8E6; border: 1px solid #F3DC9E; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #5C4300"><strong>Note from the office:</strong> Key safe 4821. Tenant's cat is friendly, keep the back door shut.</div>

<ol style="list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden">
<sc-for list="{{items}}" as="s" hint-placeholder-count="4">
<li style="{{s.cardStyle}}">
<div style="display: flex; gap: 12px; align-items: center">
<span style="{{s.badgeStyle}}">{{s.badge}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{s.title}}</span><span style="font-size: 12px; color: #55615A">{{s.sub}}</span></span>
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><span style="width: 48px; height: 48px; border-radius: 10px; background: #DCE5DF; display: flex; align-items: center; justify-content: center; color: #55615A; font-size: 10px; font-weight: 700">Photo</span></sc-if>
</div>
<sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<p style="margin: 0; font-size: 14px; color: #34403A">{{s.desc}}</p>
<button onClick="{{s.shoot}}" style="height: 56px; border: 0; border-radius: 14px; background: #1B5E3B; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>Take photo</button>
<button style="height: 44px; border: 1px solid #C9D1CC; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #15211B">Add a note</button>
</div>
</sc-if>
</li>
</sc-for>
</ol>

<footer style="background: #FFFFFF; border-top: 1px solid #E2E7E3; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 6px">
<button disabled="{{submitDisabled}}" style="{{submitStyle}}">Submit for review</button>
<span style="font-size: 12px; color: #55615A; text-align: center">{{submitHint}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: [1] };
  }
  renderVals() {
    var self = this;
    var done = this.state.done;
    var data = [
      ['Kitchen worktops clean and dry', 'Kitchen', 'Include behind the kettle and toaster. Photo the full length of the worktop.'],
      ['Bathroom mirror streak-free', 'Bathroom', 'Take the photo at an angle so streaks would show.'],
      ['Floors vacuumed and mopped', 'Whole home', 'One photo per room is ideal.'],
      ['Bins emptied and relined', 'Kitchen', 'Show the fresh liner.']
    ];
    var openIdx = 0;
    for (var i = 1; i <= data.length; i++) { if (done.indexOf(i) < 0) { openIdx = i; break; } }
    var items = data.map(function (d, k) {
      var n = k + 1, isDone = done.indexOf(n) >= 0, isOpen = n === openIdx;
      return {
        title: d[0], desc: d[2], done: isDone, open: isOpen,
        sub: isDone ? 'Photographed' : isOpen ? d[1] + ' · up next' : d[1],
        badge: isDone ? '✓' : String(n),
        badgeStyle: 'width:30px;height:30px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;' + (isDone ? 'background:#1B5E3B;color:#FFFFFF' : isOpen ? 'background:#15211B;color:#FFFFFF' : 'background:#FFFFFF;color:#55615A;border:1.5px solid #C9D1CC'),
        cardStyle: 'background:#FFFFFF;border-radius:16px;padding:12px 14px;' + (isOpen ? 'border:2px solid #1B5E3B;box-shadow:0 6px 18px rgba(15,59,38,0.10)' : 'border:1px solid #E2E7E3'),
        shoot: function () { self.setState({ done: done.concat([n]) }); }
      };
    });
    var left = data.length - done.length;
    var ready = left === 0;
    return {
      items: items,
      bar: 'height:100%;background:#1B5E3B;width:' + Math.round(done.length / data.length * 100) + '%',
      doneLabel: done.length + ' of ' + data.length + ' standards photographed',
      submitDisabled: !ready,
      submitStyle: 'height:54px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:800;' + (ready ? 'background:#1B5E3B;color:#FFFFFF;cursor:pointer' : 'background:#E8ECE9;color:#6B7670'),
      submitHint: ready ? 'Jane Supervisor will be notified' : left + (left === 1 ? ' photo' : ' photos') + ' to go before you can submit'
    };
  }
}
</script>
</body>
</html>
