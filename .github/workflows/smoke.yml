name: Smoke tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to smoke-test"
        required: true

jobs:
  smoke:
    # Vercel's GitHub integration posts a deployment_status event for
    # every deploy (Preview on every branch push, Production on every
    # push to main) -- only run the suite after a Production deploy
    # succeeds, not on every WIP preview. workflow_dispatch always runs
    # (it's a deliberate manual trigger against whatever URL is given).
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
