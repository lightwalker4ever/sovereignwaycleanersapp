name: CI

on:
  pull_request:
  push:
    # TODO: drop the feature branch before merging -- temporary, to
    # verify this branch's CI run without a gh CLI/PR available.
    branches: [main, net/standards-overhaul-client-areas]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
