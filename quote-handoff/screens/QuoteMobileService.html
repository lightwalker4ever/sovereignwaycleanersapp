<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote on mobile: pick a service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B5E3B;text-decoration:none}a:hover{color:#0F3B26}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F7F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15211B; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #FFFFFF; border-bottom: 1px solid #E2E7E3; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #0F3B26; color: #E9C46A; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">SW</span>
<span style="flex: 1; font-size: 13px; font-weight: 700; color: #55615A">Step 1 of 4 · Service</span>
<a href="#" aria-label="Close quote" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15211B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></a>
</div>
<div style="height: 6px; border-radius: 99px; background: #E8ECE9; overflow: hidden"><div style="height: 100%; width: 25%; background: #1B5E3B"></div></div>
</header>

<div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">What do you need cleaned?</h1>
<div style="display: flex; align-items: center; gap: 10px; background: #DFF1E5; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #155B33">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
<span style="flex: 1; font-weight: 600">We clean in <strong>N12 0ES</strong></span><a href="#" style="font-weight: 700; font-size: 13px">Change</a>
</div>

<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #55615A">Instant price</h2></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{instant}}" as="c" hint-placeholder-count="3">
<a href="QuoteMobileDetails.html" style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; color: #15211B; min-height: 48px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #DFF1E5; color: #1B5E3B; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 800; font-size: 15px">{{c.name}}</span><span style="font-size: 12px; color: #55615A">{{c.desc}}</span></span>
<span style="font-size: 12px; font-weight: 700; color: #155B33; background: #DFF1E5; border-radius: 999px; padding: 4px 8px; white-space: nowrap">See price</span>
</a>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 4px"><h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #55615A">Tailored quote</h2><span style="font-size: 13px; color: #55615A">We'll email your price within 24 hours</span></div>
<div style="background: #FFFFFF; border: 1px solid #E2E7E3; border-radius: 14px; overflow: hidden">
<sc-for list="{{tailored}}" as="c" hint-placeholder-count="6">
<a href="QuoteMobileTailored.html" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 52px; border-bottom: 1px solid #EEF1EF; color: #15211B">
<span style="flex: 1; font-weight: 700; font-size: 15px">{{c}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55615A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      instant: [
        { name: 'End of Tenancy', desc: 'To landlord and agency standards', d: 'M15 7a4 4 0 1 1-3.9 4.9L3 20v-3l2-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7z M16 10h.01' },
        { name: 'Deep Cleaning', desc: 'Top to bottom, room by room', d: 'M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z' },
        { name: 'Office Cleaning', desc: 'By hours or floor area', d: 'M3 7h18v13H3z M8 7V4h8v3 M3 12h18' }
      ],
      tailored: ['Domestic Cleaning', 'Commercial Cleaning', 'Carpet Cleaning', 'After Build Clean', 'Builders & Sparkle Clean', 'Move In / Out Cleaning']
    };
  }
}
</script>
</body>
</html>
